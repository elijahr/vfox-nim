# TEMPORARY: smoke-tests the README "GitHub Actions" example across all 3 OSes.
# Mirrors the documented example, but swaps the final `nimble test` for
# `nimble refresh` (this repo is not a Nim project) so it still exercises
# nimble's HTTPS path — the real payoff of the Windows DLL step. Uses
# `install: false` so it tests the example flow, not vfox-nim's own dev tooling.
# This file is pushed to main only to run once, then removed.
name: GHA Example Smoke Test

# yamllint disable rule:truthy
on:
  # yamllint enable rule:truthy
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/workflows/smoke-gha-example.yml"]

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          install: false

      - name: Install Nim via vfox-nim
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # avoid GitHub API rate limits
        run: |
          mise plugin install nim https://github.com/elijahr/vfox-nim
          mise use nim@2.2.0
          mise exec -- nim --version

      # On Windows, Nim and Nimble are dynamically linked against OpenSSL and PCRE.
      # Install Nim's DLL bundle (plus a CA bundle for HTTPS) so `nimble` works.
      - name: Install Nim runtime DLLs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://nim-lang.org/download/dlls.zip -OutFile dlls.zip
          Expand-Archive dlls.zip -DestinationPath "$Env:GITHUB_WORKSPACE\nim-dlls" -Force
          "$Env:GITHUB_WORKSPACE\nim-dlls" >> $Env:GITHUB_PATH
          Invoke-WebRequest https://curl.se/ca/cacert.pem -OutFile "$Env:GITHUB_WORKSPACE\cacert.pem"
          "SSL_CERT_FILE=$Env:GITHUB_WORKSPACE\cacert.pem" >> $Env:GITHUB_ENV

      - name: Validate nimble HTTPS works (the DLL payoff)
        shell: bash
        run: |
          mise exec -- nimble --version
          mise exec -- nimble refresh
