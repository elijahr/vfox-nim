# TEMPORARY (windows-ci-verify branch / axiomantic mirror): Windows-only to verify the Windows leg on real CI. DO NOT MERGE this workflow change back to elijahr.
# yamllint disable rule:line-length

name: test

# yamllint disable rule:truthy
on:
  # yamllint enable rule:truthy
  workflow_dispatch: {}
  pull_request:
    branches: ["*"]
    paths:
      - .github/workflows/test.yml # changes to this file
      - lib/** # changes to library functions
      - hooks/** # changes to vfox lua hooks
      - spec/** # changes to lua tests
      - test/** # changes to integration tests
      - .luacheckrc # lua linting config
      - .pre-commit-config.yaml # pre-commit hooks config
      - .yamllint.yml # yaml linting config
      - stylua.toml # lua formatting config
  push:
    branches: ["main"]
    tags: ["*"]
    paths:
      - .github/workflows/test.yml # changes to this file
      - lib/** # changes to library functions
      - hooks/** # changes to vfox lua hooks
      - spec/** # changes to lua tests
      - test/** # changes to integration tests
      - .luacheckrc # lua linting config
      - .pre-commit-config.yaml # pre-commit hooks config
      - .yamllint.yml # yaml linting config
      - stylua.toml # lua formatting config

jobs:
  # Pre-commit checks (linting, formatting)
  lint:
    name: Lint

    if: false # TEMPORARY (windows-ci-verify): disabled to conserve mirror Actions credits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install mise and .tool-versions
        uses: jdx/mise-action@v2

      - name: Install lua tools (Windows)
        if: runner.os == 'Windows'
        run: |
          mise exec -- luarocks.exe --lua-version 5.1 install busted
          mise exec -- luarocks.exe --lua-version 5.1 install luacheck

      - name: Install lua tools (Linux and macOS)
        if: runner.os != 'Windows'
        run: |
          mise exec -- luarocks --lua-version 5.1 install busted
          mise exec -- luarocks --lua-version 5.1 install luacheck

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  # Test Lua plugin implementation
  lua_tests:
    name: Lua unit tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-lua

      - name: Run Lua unit tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: busted spec/ -v

      - name: Run Lua unit tests (Windows)
        if: runner.os == 'Windows'
        shell: "msys2 {0}"
        run: |
          echo "PWD=$(pwd)"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "cygpath=$(cygpath -u "$GITHUB_WORKSPACE")"
          ls -la || true
          ls -la spec 2>/dev/null || echo "no spec/ in PWD"
          cd "$(cygpath -u "$GITHUB_WORKSPACE")" 2>/dev/null || cd "$GITHUB_WORKSPACE" 2>/dev/null || true
          echo "after cd PWD=$(pwd)"
          ls -la spec 2>/dev/null || echo "no spec/ after cd"
          busted spec/ -v

  # Test mise integration (with integration test script)
  mise_integration_test:
    name: Mise integration tests / ${{ matrix.os }}
    if: false # TEMPORARY (windows-ci-verify): disabled to conserve mirror Actions credits
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    # TODO(windows): deferred this session — re-enable as blocking once a green Windows CI run is confirmed (design §1.4)
    continue-on-error: ${{ matrix.os == 'windows-latest' }}

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-lua

      - name: Install mise and .tool-versions
        uses: jdx/mise-action@v2

      - name: Run mise integration tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: mise exec -- busted test/mise-integration_spec.lua -v
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISE_YES: 1

      - name: Run mise integration tests (Windows)
        if: runner.os == 'Windows'
        shell: "msys2 {0}"
        run: mise exec -- busted test/mise-integration_spec.lua -v
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISE_YES: 1

  # Test vfox integration (with integration test script)
  vfox_integration_test:
    name: vfox integration tests / ${{ matrix.os }}
    if: false # TEMPORARY (windows-ci-verify): disabled to conserve mirror Actions credits
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    # TODO(windows): deferred this session — re-enable as blocking once a green Windows CI run is confirmed (design §1.4)
    continue-on-error: ${{ matrix.os == 'windows-latest' }}

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-lua

      - name: Install vfox and .tool-versions (Windows)
        uses: MinoruSekine/setup-scoop@v4.0.2
        if: runner.os == 'Windows'
        with:
          apps: vfox

      - name: Install vfox and .tool-versions (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            echo "deb [trusted=yes] https://apt.fury.io/versionfox/ /" | sudo tee /etc/apt/sources.list.d/versionfox.list
            sudo apt-get update
            sudo apt-get install -y vfox
          else
            brew tap version-fox/tap
            brew install vfox
          fi

      - name: Install vfox tools
        run: |
          vfox install --all --yes

      - name: Run vfox integration tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: busted test/vfox-integration_spec.lua -v
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run vfox integration tests (Windows)
        if: runner.os == 'Windows'
        shell: "msys2 {0}"
        run: busted test/vfox-integration_spec.lua -v
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
