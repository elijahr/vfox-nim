# yamllint disable rule:line-length

name: test

# yamllint disable rule:truthy
on:
  # yamllint enable rule:truthy
  workflow_dispatch: {}
  pull_request:
    branches: ["*"]
    paths:
      - .github/workflows/test.yml # changes to this file
      - lib/** # changes to library functions
      - hooks/** # changes to vfox lua hooks
      - spec/** # changes to lua tests
      - test/** # changes to integration tests
      - .luacheckrc # lua linting config
      - .pre-commit-config.yaml # pre-commit hooks config
      - .yamllint.yml # yaml linting config
      - stylua.toml # lua formatting config
  push:
    branches: ["main"]
    tags: ["*"]
    paths:
      - .github/workflows/test.yml # changes to this file
      - lib/** # changes to library functions
      - hooks/** # changes to vfox lua hooks
      - spec/** # changes to lua tests
      - test/** # changes to integration tests
      - .luacheckrc # lua linting config
      - .pre-commit-config.yaml # pre-commit hooks config
      - .yamllint.yml # yaml linting config
      - stylua.toml # lua formatting config

jobs:
  # Pre-commit checks (linting, formatting)
  lint:
    name: Lint

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Provides luacheck + busted on $GITHUB_PATH via hererocks (PUC Lua 5.1).
      # pre-commit's luacheck hook (language: system) resolves luacheck from this
      # PATH. setup-lua's Linux step also installs libreadline-dev for the build.
      - uses: ./.github/actions/setup-lua

      # mise.toml pins stylua + actionlint, which pre-commit's stylua/actionlint
      # hooks need. .tool-versions no longer pins lua, so this no longer triggers a
      # source build of Lua.
      - name: Install mise and .tool-versions
        uses: jdx/mise-action@v2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  # Test Lua plugin implementation
  lua_tests:
    name: Lua unit tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-lua

      - name: Run Lua unit tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: busted spec/ -v

      - name: Run Lua unit tests (Windows)
        if: runner.os == 'Windows'
        shell: "msys2 {0}"
        # cd into the workspace (the msys2 shell starts in the MSYS2 home), and pass
        # `spec` WITHOUT a trailing slash: on Windows lfs.attributes("spec/") returns
        # nil, so busted's file discovery fails on the trailing-slash form.
        run: |
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          busted spec -v

  # Test mise integration (with integration test script)
  mise_integration_test:
    name: Mise integration tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-lua

      - name: Install mise and .tool-versions
        uses: jdx/mise-action@v2
        with:
          install: false

      - name: Run mise integration tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: mise exec -- busted test/mise-integration_spec.lua -v
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISE_YES: 1

      - name: Run mise integration tests (Windows)
        if: runner.os == 'Windows'
        shell: "msys2 {0}"
        # Run busted DIRECTLY (not via `mise exec`): `mise exec` activates the
        # project env, which makes mise try to install .tool-versions' `lua 5.1`
        # from source (vfox-lua `make` fails on Windows). busted is already on the
        # msys2 PATH (setup-lua), and the spec drives mise itself via the inherited
        # PATH (path-type: inherit). cd into the workspace first (msys2 starts in
        # the MSYS2 home).
        run: |
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          busted test/mise-integration_spec.lua -v
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISE_YES: 1

  # Test vfox integration (with integration test script)
  vfox_integration_test:
    name: vfox integration tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-lua

      - name: Install vfox and .tool-versions (Windows)
        uses: MinoruSekine/setup-scoop@v4.0.2
        if: runner.os == 'Windows'
        with:
          apps: vfox

      - name: Install vfox and .tool-versions (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            echo "deb [trusted=yes] https://apt.fury.io/versionfox/ /" | sudo tee /etc/apt/sources.list.d/versionfox.list
            sudo apt-get update
            sudo apt-get install -y vfox
          else
            brew tap version-fox/tap
            brew install vfox
          fi

      # On Windows this would source-build .tool-versions' lua 5.1 (fails); the
      # integration spec installs nim itself, so the global tools aren't needed.
      - name: Install vfox tools
        if: runner.os != 'Windows'
        run: |
          vfox install --all --yes

      - name: Run vfox integration tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: busted test/vfox-integration_spec.lua -v
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run vfox integration tests (Windows)
        if: runner.os == 'Windows'
        shell: "msys2 {0}"
        run: |
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          busted test/vfox-integration_spec.lua -v
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
