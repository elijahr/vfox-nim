# yamllint disable rule:line-length
name: "Setup Nim with vfox-nim"
description: "Install and configure Nim (or Nimony) compiler using vfox-nim across Linux, macOS, and Windows"
author: "elijahr"

inputs:
  version:
    description: "Nim or Nimony version to install (e.g. latest, 2.2.10, nimony, nimony-latest, ref:devel)"
    required: false
    default: "latest"
  nim-version:
    description: "Alias for version (for compatibility with setup-nim-action)"
    required: false
    default: ""
  vfox-version:
    description: "Version of vfox CLI to install if not present"
    required: false
    default: "1.0.11"

runs:
  using: "composite"
  steps:
    - name: Set up Nim via vfox-nim
      shell: bash
      run: |
        set -euo pipefail

        # Resolve requested version (nim-version input takes precedence if provided)
        TARGET_VERSION="${{ inputs.nim-version }}"
        if [ -z "$TARGET_VERSION" ]; then
          TARGET_VERSION="${{ inputs.version }}"
        fi
        echo "Requested Nim version: $TARGET_VERSION"

        # 1. Install vfox CLI if not present
        if ! command -v vfox >/dev/null 2>&1; then
          echo "vfox not found on PATH. Installing vfox v${{ inputs.vfox-version }}..."
          OS_NAME="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH_NAME="$(uname -m)"

          VFOX_INSTALL_DIR="$HOME/.vfox-bin"
          mkdir -p "$VFOX_INSTALL_DIR"
          TMP_DIR="$(mktemp -d)"

          case "$OS_NAME" in
            linux*)
              VFOX_OS="linux"
              case "$ARCH_NAME" in
                x86_64|amd64) VFOX_ARCH="x86_64" ;;
                aarch64|arm64) VFOX_ARCH="aarch64" ;;
                *) echo "::error::Unsupported architecture for vfox: $ARCH_NAME"; exit 1 ;;
              esac
              ARCHIVE_NAME="vfox_${{ inputs.vfox-version }}_${VFOX_OS}_${VFOX_ARCH}.tar.gz"
              DOWNLOAD_URL="https://github.com/version-fox/vfox/releases/download/v${{ inputs.vfox-version }}/${ARCHIVE_NAME}"
              curl -sSL "$DOWNLOAD_URL" -o "$TMP_DIR/$ARCHIVE_NAME"
              tar -xzf "$TMP_DIR/$ARCHIVE_NAME" -C "$VFOX_INSTALL_DIR" --strip-components=1
              chmod +x "$VFOX_INSTALL_DIR/vfox"
              ;;
            darwin*)
              VFOX_OS="macos"
              case "$ARCH_NAME" in
                x86_64|amd64) VFOX_ARCH="x86_64" ;;
                aarch64|arm64) VFOX_ARCH="aarch64" ;;
                *) echo "::error::Unsupported architecture for vfox: $ARCH_NAME"; exit 1 ;;
              esac
              ARCHIVE_NAME="vfox_${{ inputs.vfox-version }}_${VFOX_OS}_${VFOX_ARCH}.tar.gz"
              DOWNLOAD_URL="https://github.com/version-fox/vfox/releases/download/v${{ inputs.vfox-version }}/${ARCHIVE_NAME}"
              curl -sSL "$DOWNLOAD_URL" -o "$TMP_DIR/$ARCHIVE_NAME"
              tar -xzf "$TMP_DIR/$ARCHIVE_NAME" -C "$VFOX_INSTALL_DIR" --strip-components=1
              chmod +x "$VFOX_INSTALL_DIR/vfox"
              ;;
            mingw*|msys*|cygwin*|windows*)
              VFOX_OS="windows"
              case "$ARCH_NAME" in
                x86_64|amd64) VFOX_ARCH="x86_64" ;;
                aarch64|arm64) VFOX_ARCH="aarch64" ;;
                *) echo "::error::Unsupported architecture for vfox: $ARCH_NAME"; exit 1 ;;
              esac
              ARCHIVE_NAME="vfox_${{ inputs.vfox-version }}_${VFOX_OS}_${VFOX_ARCH}.zip"
              DOWNLOAD_URL="https://github.com/version-fox/vfox/releases/download/v${{ inputs.vfox-version }}/${ARCHIVE_NAME}"
              curl -sSL "$DOWNLOAD_URL" -o "$TMP_DIR/$ARCHIVE_NAME"
              unzip -j -o "$TMP_DIR/$ARCHIVE_NAME" '*/vfox.exe' -d "$VFOX_INSTALL_DIR"
              ;;
            *)
              echo "::error::Unsupported OS for vfox: $OS_NAME"
              exit 1
              ;;
          esac

          rm -rf "$TMP_DIR"
          if command -v cygpath >/dev/null 2>&1; then
            echo "$(cygpath -w "$VFOX_INSTALL_DIR")" >> "$GITHUB_PATH"
          else
            echo "$VFOX_INSTALL_DIR" >> "$GITHUB_PATH"
          fi
          export PATH="$VFOX_INSTALL_DIR:$PATH"
        fi

        echo "vfox binary: $(command -v vfox)"
        echo "vfox version: $(vfox --version)"

        # 2. Package and register vfox-nim plugin
        VFOX_ROOT="${VFOX_HOME:-$HOME/.version-fox}"
        mkdir -p "$VFOX_ROOT/plugin"
        if command -v cygpath >/dev/null 2>&1; then
          export VFOX_HOME="$(cygpath -w "$VFOX_ROOT")"
        fi

        PYTHON_BIN="python3"
        if ! command -v python3 >/dev/null 2>&1; then
          PYTHON_BIN="python"
        fi

        PLUGIN_ZIP_BASE="$(mktemp -u)"
        ACTION_PATH="${{ github.action_path }}"
        if command -v cygpath >/dev/null 2>&1; then
          PY_ZIP_BASE="$(cygpath -w "$PLUGIN_ZIP_BASE")"
          PY_ACTION_PATH="$(cygpath -w "$ACTION_PATH")"
        else
          PY_ZIP_BASE="$PLUGIN_ZIP_BASE"
          PY_ACTION_PATH="$ACTION_PATH"
        fi

        $PYTHON_BIN -c "import shutil; shutil.make_archive(r'$PY_ZIP_BASE', 'zip', r'$PY_ACTION_PATH')"
        PLUGIN_ZIP="${PLUGIN_ZIP_BASE}.zip"
        if command -v cygpath >/dev/null 2>&1; then
          VFOX_PLUGIN_ZIP="$(cygpath -w "$PLUGIN_ZIP")"
        else
          VFOX_PLUGIN_ZIP="$PLUGIN_ZIP"
        fi

        vfox remove -y nim 2>/dev/null || true
        vfox add --source "$VFOX_PLUGIN_ZIP" --alias nim
        rm -f "$PLUGIN_ZIP"

        # 3. Install requested Nim / Nimony version
        vfox install --yes "nim@$TARGET_VERSION"

        # 4. Locate installed binary directory and expose to GITHUB_PATH
        SEARCH_DIRS=("$HOME/.version-fox" "$HOME/.vfox")
        if [ -n "${VFOX_ROOT:-}" ]; then
          SEARCH_DIRS=("$VFOX_ROOT" "${SEARCH_DIRS[@]}")
        fi

        NIM_EXE=""
        for search_dir in "${SEARCH_DIRS[@]}"; do
          if [ -d "$search_dir/cache/nim" ]; then
            MATCHES="$(find "$search_dir/cache/nim" -type f \( -name "nim" -o -name "nim.exe" -o -name "nimony" -o -name "nimony.exe" \) 2>/dev/null)"
            if [ -n "$MATCHES" ]; then
              VERSION_MATCH="$(echo "$MATCHES" | grep "$TARGET_VERSION" | head -n 1 || true)"
              if [ -n "$VERSION_MATCH" ]; then
                NIM_EXE="$VERSION_MATCH"
              else
                NIM_EXE="$(echo "$MATCHES" | head -n 1)"
              fi
              break
            fi
          fi
        done

        if [ -z "$NIM_EXE" ]; then
          echo "::error::Could not find installed Nim or Nimony executable in vfox cache"
          exit 1
        fi

        BIN_DIR="$(dirname "$NIM_EXE")"
        echo "Found compiler binary at: $NIM_EXE"
        echo "Adding $BIN_DIR to GITHUB_PATH"
        if command -v cygpath >/dev/null 2>&1; then
          echo "$(cygpath -w "$BIN_DIR")" >> "$GITHUB_PATH"
        else
          echo "$BIN_DIR" >> "$GITHUB_PATH"
        fi

        # Expose ~/.nimble/bin to PATH for nimble-installed packages
        NIMBLE_BIN="$HOME/.nimble/bin"
        mkdir -p "$NIMBLE_BIN"
        if command -v cygpath >/dev/null 2>&1; then
          echo "$(cygpath -w "$NIMBLE_BIN")" >> "$GITHUB_PATH"
        else
          echo "$NIMBLE_BIN" >> "$GITHUB_PATH"
        fi

        # Verify execution
        "$NIM_EXE" --version || true
