[env]
MISE_USE_VERSIONS_HOST = "0"

[tools]
stylua = "2.3.1"
actionlint = "latest"

[tasks.test-unit]
description = "Run Lua unit tests (busted spec/) — Tiers I+II"
run = 'PATH="$HOME/.vfox-nim-rocks/bin:$PATH" busted spec/'

[tasks.test]
description = "Run integration tests (real Nim install over the network)"
run = 'PATH="$HOME/.vfox-nim-rocks/bin:$PATH" busted test/'

[tasks.format]
description = "Format Lua scripts"
run = "pre-commit run --all-files"

[tasks.lint]
description = "Lint Lua scripts and GitHub Actions using hk"
run = "pre-commit run --show-diff-on-failure --all-files"

[tasks.ci]
description = "Run all CI checks"
depends = ["lint", "test"]
